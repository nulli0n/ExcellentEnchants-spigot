name: Java CI with Maven

on:
  push:
    branches: [ "feature/placeholderapi-tooltip-support" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ExcellentEnchants
        uses: actions/checkout@v4
        with:
          path: ExcellentEnchants

      - name: Checkout NightCore
        uses: actions/checkout@v4
        with:
          repository: nulli0n/nightcore-spigot
          path: nightcore

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Install NightCore
        working-directory: nightcore
        run: mvn -B install -DskipTests

      - name: Build ExcellentEnchants
        working-directory: ExcellentEnchants
        run: mvn -B package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExcellentEnchants-build
          path: |
            ExcellentEnchants/**/target/*.jar
            !ExcellentEnchants/**/target/*-sources.jar
            !ExcellentEnchants/**/target/*-javadoc.jar
            !ExcellentEnchants/**/target/original-*.jar
